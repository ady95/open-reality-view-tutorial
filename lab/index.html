<!doctype html>
<!-- Open Reality View Lab — 책 08-1. lab/server.py가 이 파일과 MJPEG 스트림·통계를 함께 제공한다. -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open Reality View Lab</title>
<style>
  :root { --bg:#0f1115; --panel:#181b22; --line:#2a2f3a; --fg:#e8eaee; --dim:#9aa3b2; --acc:#ffd23f; --a:#5aa9ff; --b:#7bd88f; --c:#ff8a65; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 "Noto Sans KR", system-ui, sans-serif; }
  header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line); }
  h1 { font-size:18px; margin:0 12px 0 0; }
  .seg button { background:var(--panel); color:var(--fg); border:1px solid var(--line); padding:6px 12px; cursor:pointer; font:inherit; }
  .seg button:first-child { border-radius:6px 0 0 6px; } .seg button:last-child { border-radius:0 6px 6px 0; }
  .seg button.on { background:var(--acc); color:#111; border-color:var(--acc); font-weight:700; }
  label.rt { display:flex; gap:6px; align-items:center; color:var(--dim); }
  #clock { margin-left:auto; color:var(--dim); font-variant-numeric:tabular-nums; }
  main { display:grid; grid-template-columns: 1fr 360px; gap:16px; padding:16px; }
  @media (max-width: 1100px) { main { grid-template-columns: 1fr; } }
  #views { display:grid; gap:10px; grid-template-columns: 1fr; align-content:start; }
  #views.cmp { grid-template-columns: repeat(3, 1fr); }
  @media (max-width: 800px) { #views.cmp { grid-template-columns: 1fr; } }
  .view { position:relative; background:#000; border:1px solid var(--line); border-radius:8px; overflow:hidden; aspect-ratio:16/9; }
  .view img { width:100%; height:100%; object-fit:contain; display:block; }
  .tag { position:absolute; left:8px; top:8px; background:rgba(0,0,0,.65); padding:3px 8px; border-radius:5px; font-weight:700; }
  .tag i { font-style:normal; display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; }
  .note { position:absolute; left:8px; bottom:8px; right:8px; background:rgba(0,0,0,.6); padding:3px 8px; border-radius:5px; color:#ddd; font-size:12px; }
  aside { display:flex; flex-direction:column; gap:12px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px; }
  .card h2 { font-size:14px; margin:0 0 8px; }
  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  td, th { padding:4px 6px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
  th { color:var(--dim); font-weight:500; }
  .bar { display:flex; height:16px; border-radius:4px; overflow:hidden; margin:6px 0; background:#222; }
  .bar span { display:block; height:100%; }
  .legend span { margin-right:10px; color:var(--dim); font-size:12px; } .legend i { display:inline-block; width:9px; height:9px; margin-right:4px; }
  .num { font-variant-numeric:tabular-nums; }
  #bench { margin-top:16px; }
  #info th:first-child { white-space:nowrap; }
</style>
</head>
<body>
<header>
  <h1>Open Reality View Lab</h1>
  <div class="seg" id="mode">
    <button data-m="A">Track A · 3DGS</button><button data-m="B">Track B · Feed-forward</button><button data-m="C" class="on">Track C · 생성</button><button data-m="ALL">3개 비교</button>
  </div>
  <label class="rt"><input type="checkbox" id="rt"> 실시간 제약 (실차였다면 보였을 화면)</label>
  <span id="clock">nuScenes scene-0916 · 0.0초</span>
</header>
<main>
  <section>
    <div id="views"></div>
    <div class="card" id="bench"><h2>07-2 인과적 벤치마크 (CARLA 20초 롤아웃, 1,200프레임)</h2><table id="btab"></table></div>
  </section>
  <aside>
    <div class="card"><h2 id="infoTitle">방식 비교</h2><table id="info"></table></div>
    <div class="card">
      <h2>Track C 실시간 지연 (청크 = 4프레임)</h2>
      <div class="bar" id="cbar"></div>
      <div class="legend"><span><i style="background:#8d99ae"></i>JPEG 읽기</span><span><i style="background:#5aa9ff"></i>인코더</span><span><i style="background:#ff8a65"></i>DiT</span><span><i style="background:#7bd88f"></i>디코더</span></div>
      <table id="live"></table>
    </div>
  </aside>
</main>
<script>
const COLORS = { A: "var(--a)", B: "var(--b)", C: "var(--c)" };
const NAMES = { A: "Track A · 3DGS 사전 재구성", B: "Track B · Feed-forward", C: "Track C · 생성 모델" };
let mode = "C", info = null;
const $ = (s) => document.querySelector(s);

function render() {
  const rt = $("#rt").checked ? 1 : 0;
  const tracks = mode === "ALL" ? ["A", "B", "C"] : [mode];
  const v = $("#views");
  // 이전 MJPEG 연결을 먼저 끊는다. 그대로 두면 브라우저의 같은 서버 동시 연결 한도(6개)에 걸려 새 스트림과 통계 요청이 멈춘다
  v.querySelectorAll("img").forEach(i => { i.src = "data:,"; });
  v.className = mode === "ALL" ? "cmp" : "";
  v.innerHTML = tracks.map(t => `<div class="view"><img src="/stream?track=${t}&rt=${rt}&_=${Date.now()}" alt="${NAMES[t]}">
     <div class="tag"><i style="background:${COLORS[t]}"></i>${NAMES[t]}</div><div class="note" id="note${t}"></div></div>`).join("");
  document.querySelectorAll("#mode button").forEach(b => b.classList.toggle("on", b.dataset.m === mode));
  drawInfo();
}

function drawInfo() {
  if (!info) return;
  const rows = [["프로토콜", "protocol"], ["화면 출처", "source"], ["입력", "input"], ["첫 화면까지", "first"], ["프레임당 처리", "per_frame"], ["화면 빈 곳", "empty"]];
  const cols = ["A", "B", "C"];
  $("#info").innerHTML = `<tr><th></th>${cols.map(c => `<th style="color:${COLORS[c]}">${c}</th>`).join("")}</tr>` +
    rows.map(([l, k]) => `<tr><th>${l}</th>${cols.map(c => `<td>${info[c][k] ?? "-"}</td>`).join("")}</tr>`).join("");
}

function notes(live) {
  const rt = $("#rt").checked;
  const set = (t, s) => { const e = document.getElementById("note" + t); if (e) e.textContent = s; };
  set("A", rt ? "오프라인: 미래 프레임까지 써서 미리 만든 장면이므로 실차에서는 이 화면을 만들 수 없습니다" : "사전 재구성한 3D 장면의 렌더 (Pseudo-GT)");
  set("B", rt ? `실측 처리 속도대로 약 ${info.B.realtime_fps}fps로 갱신 · 흰 곳은 카메라가 보지 못한 빈 곳` : "흰 곳은 카메라가 보지 못한 빈 곳");
  set("C", rt ? `청크 버퍼링 300ms + 계산 → 약 ${live.lag_ms ?? "-"}ms 늦게 표시` : `NFE ${info.C.nfe} · 서버에서 매 청크 실시간 생성`);
}

async function poll() {
  try {
    const s = await (await fetch("/stats")).json();
    info = s.info; if (!$("#info").innerHTML) drawInfo();
    $("#clock").textContent = `nuScenes scene-0916 · ${s.scene_t.toFixed(1)}초`;
    const L = s.live;
    if (L.total) {
      const parts = [["load", "#8d99ae"], ["enc", "#5aa9ff"], ["dit", "#ff8a65"], ["dec", "#7bd88f"]];
      $("#cbar").innerHTML = parts.map(([k, c]) => `<span style="width:${100 * L[k].p50 / L.total.p50}%;background:${c}" title="${k}"></span>`).join("");
      $("#live").innerHTML = `<tr><th>단계</th><th>P50</th><th>P95</th></tr>` +
        [["JPEG 읽기 (24장)", "load"], ["인코더 DINOv2-S", "enc"], ["DiT", "dit"], ["디코더 TAESD", "dec"], ["청크 합계", "total"]]
          .map(([n, k]) => `<tr><td>${n}</td><td class="num">${L[k].p50}ms</td><td class="num">${L[k].p95}ms</td></tr>`).join("") +
        `<tr><td>처리량 (P50)</td><td class="num" colspan="2">${(4000 / L.total.p50).toFixed(1)} fps</td></tr>` +
        `<tr><td>GPU 메모리 최대</td><td class="num" colspan="2">${L.peak_gib} GiB</td></tr>` +
        `<tr><td>측정 청크 수</td><td class="num" colspan="2">${L.chunks}</td></tr>`;
      notes(L);
    }
  } catch (e) { /* 서버 재시작 중 */ }
}

async function bench() {
  try {
    const b = await (await fetch("/bench")).json();
    const c = b.causal; if (!c) return;
    const rows = [["vae", "VAE 복원 (상한)"], ["frozen", "정지 화면"], ["fm4", "FM NFE 4"], ["mf1", "MeanFlow NFE 1"], ["mf2", "MeanFlow NFE 2"], ["mf2_taesd", "MeanFlow NFE 2 + TAESD"]];
    $("#btab").innerHTML = `<tr><th>방법</th><th>PSNR</th><th>LPIPS</th><th>AbsRel</th><th>허위 물체/100</th><th>누락 물체/100</th><th>깜빡임 (정답 ${c.gt?.flicker ?? "-"})</th><th>청크 P50/P95</th></tr>` +
      rows.filter(([k]) => c[k]).map(([k, n]) => { const r = c[k];
        return `<tr><td>${n}</td><td class="num">${r.psnr}</td><td class="num">${r.lpips}</td><td class="num">${r.absrel}</td><td class="num">${r.false_obj_rel_per100}</td><td class="num">${r.missed_obj_rel_per100}</td><td class="num">${r.flicker}</td><td class="num">${r.chunk_ms_p50 ? r.chunk_ms_p50 + " / " + r.chunk_ms_p95 + "ms" : "-"}</td></tr>`; }).join("");
  } catch (e) {}
}

document.querySelectorAll("#mode button").forEach(b => b.onclick = () => { mode = b.dataset.m; render(); });
$("#rt").onchange = render;
render(); poll(); bench(); setInterval(poll, 1000);
</script>
</body>
</html>
